services:
  postgres:
    image: postgres:17
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: football_dev_password
      POSTGRES_DB: football
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
